# Plumber overlay config. Inherits every control from Plumber's
# baseline; you only write what you change. New controls Plumber ships
# appear automatically. Run 'plumber config resolve' to see the full
# effective config, or 'plumber config generate' for the commented template.
extends: plumber:default
version: "2.0"

github:
  controls:
    githubActionMustComeFromAuthorizedSources:
      # Keep Plumber's curated list of trusted owners and extend it with the
      # one third-party action this repo relies on: jdx/mise-action installs
      # the toolchain from mise.toml (see .github/workflows/kingfisher.yml).
      includePlumberDefaults: true
      trustedGithubActions:
        - jdx/mise-action
