name: release-please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # The long-lived PAT only needs to create/update the release PR.
      # Release creation and asset publishing use the ephemeral GITHUB_TOKEN
      # (the workflow grants contents: write), so the PAT does not need
      # repository content write access.
      - name: Create or update the release PR
        id: release_pr
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

      - name: Create the draft release
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

  build_and_upload:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: git-mirror
            base_name: git-mirror-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact_name: git-mirror
            base_name: git-mirror-linux-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: git-mirror
            base_name: git-mirror-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: git-mirror
            base_name: git-mirror-macos-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: git-mirror.exe
            base_name: git-mirror-windows-x86_64
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag_name }}
          persist-credentials: false

      - name: Resolve version from tag
        id: version
        shell: bash
        run: |
          TAG="${{ needs.release.outputs.tag_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compiler for ARM64 (Linux)
        if: matrix.os == 'ubuntu-latest' && matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build release binary
        run: |
          cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Package binary (Linux/macOS)
        if: matrix.os != 'windows-latest'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ARCHIVE_NAME="${{ matrix.base_name }}-v${VERSION}.tar.gz"
          cd target/${{ matrix.target }}/release
          tar czf "../../../${ARCHIVE_NAME}" ${{ matrix.artifact_name }}
          cd ../../..
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "${ARCHIVE_NAME}" | awk '{print $1 "  " $2}' > "${ARCHIVE_NAME}.sha256"
          else
            echo "Error: No suitable SHA-256 checksum tool found (sha256sum or shasum)." >&2
            exit 1
          fi

      - name: Package binary (Windows)
        if: matrix.os == 'windows-latest'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $ArchiveName = "${{ matrix.base_name }}-v${env:VERSION}.zip"
          cd target\${{ matrix.target }}\release
          7z a ..\..\..\$ArchiveName ${{ matrix.artifact_name }}
          cd ..\..\..
          $hash = (Get-FileHash -Algorithm SHA256 $ArchiveName).Hash.ToLower()
          "$hash  $ArchiveName" | Out-File -Encoding ASCII "${ArchiveName}.sha256"
        shell: powershell

      - name: Upload artifacts to workflow
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.base_name }}-v${{ steps.version.outputs.version }}
          path: |
            ${{ matrix.base_name }}-v*.tar.gz
            ${{ matrix.base_name }}-v*.zip
            ${{ matrix.base_name }}-v*.sha256

  publish_release:
    needs: [release, build_and_upload]
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Upload assets and publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag_name }}
        run: |
          gh release upload "$TAG" ./artifacts/* --clobber
          gh release edit "$TAG" --draft=false
